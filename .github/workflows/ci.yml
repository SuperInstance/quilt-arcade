name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install --no-save yaml || true
      - name: 55-check arcade harness + all games
        run: node run_all.mjs
      - name: GAN-hardened holdem elites
        run: node games/holdem/gan-elites/verify.mjs
